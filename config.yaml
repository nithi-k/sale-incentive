# ชื่อคอลัมน์ในไฟล์ CSV (แก้ให้ตรงกับไฟล์จริง)
columns:
  date: date            # วันที่เปิดบิล (YYYY-MM-DD)
  salesperson: salesperson
  customer: customer    # รหัสลูกค้า
  pline: pline          # กลุ่มสินค้า (Pline)
  amount: amount        # ยอดขายก่อน VAT

# จำนวนปีย้อนหลังที่ใช้เช็คลูกค้าใหม่ / สินค้าใหม่ (ไม่นับปีที่คำนวณ)
lookback_years: 2

rates:
  NC: 0.03     # ลูกค้าใหม่
  OCNP: 0.01   # ลูกค้าเก่า + สินค้าใหม่
  OCOP: 0.005  # ลูกค้าเก่า + สินค้าเก่า
