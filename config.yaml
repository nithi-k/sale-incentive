# ชื่อคอลัมน์ในไฟล์ยอดขาย (Raw Text จากระบบ, คั่นด้วย |)
columns:
  date: Invoice Date        # YYYY-MM-DD
  salesperson: Saleman
  customer: Customer No.
  pline: P-line
  amount: Net Price (THB)   # ยอดก่อน VAT
  margin: PGross            # Margin ของแต่ละแถว
  product_class: P-class    # SAS: GTP = เครื่องจักร
  bu: BU                    # SAS: BDI = ตัวแทนจำหน่าย
  qty: Qty                  # CM: ราคาต่อหน่วย = Net Price / Qty
  min_price: MIN Price      # CM: เครื่องจักรต้องขายไม่ต่ำกว่า MIN Price

# ข้อมูลการรับชำระ (SAS / CM / DAP UV) — แก้ชื่อคอลัมน์ให้ตรงเมื่อ Sale Report มีคอลัมน์ใหม่
# ถ้าไม่พบคอลัมน์ในไฟล์: คิดจากยอด Invoice ทั้งหมด และแจ้งเตือนในหน้าเว็บ
payment:
  paid_date_column: Paid Date          # วันที่ชำระครบ (ผ่อนเป็นงวด = วันที่ชำระงวดสุดท้าย); ว่าง = ยังไม่ชำระ
  md_approval_column: Approve By       # CM: มีค่า = MD อนุมัติขายต่ำกว่า MIN Price แล้ว

# ตัวคั่นคอลัมน์ของไฟล์ .txt
delimiter: "|"

# รูปแบบค่าในคอลัมน์ margin:
#   ratio   = 0.25 หมายถึง 25%
#   percent = 25 หมายถึง 25%
#   amount  = กำไรขั้นต้นเป็นบาท (คิด % จาก amount)
margin_type: ratio

# คอลัมน์ที่ไม่แสดงใน raw_data output (ข้อมูลต้นทุน/กำไร — Sale ไม่ควรเห็น)
# คอลัมน์ margin ถูกซ่อนเสมออยู่แล้ว
hide_columns:
  - Actual Cost(THB)
  - Cost AMT
  - Gross

# แถวที่ไม่คิด Commission (ยังนับเป็นประวัติลูกค้า/สินค้า และแสดงใน raw_data)
no_commission:
  item_nos: [USDB]                  # Item No. ที่ไม่คิด Commission
  zero_cost_column: Actual Cost(THB) # แถวที่ต้นทุนในคอลัมน์นี้เป็น 0

# P-line ที่ไม่นับเป็นยอดขาย (ถ้ามี) เช่น [XXX, YYY]
exclude_plines: []

# จำนวนปีย้อนหลังที่ใช้เช็คลูกค้าใหม่ / สินค้าใหม่ (ไม่นับปีที่คำนวณ)
lookback_years: 2

# ไฟล์อัตรา Commission (Type x Margin Tier) ในโฟลเดอร์ data/ — กรอกช่องสีเหลืองให้ครบก่อนรัน
rates_file: rates.xlsx   # อยู่ใน data/
