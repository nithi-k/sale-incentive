# ชื่อคอลัมน์ในไฟล์ CSV (ตามรูปแบบไฟล์จากระบบ)
columns:
  day: Day
  month: Month
  year: Year
  salesperson: Saleman
  customer: Customer No.
  pline: P-line
  amount: Net Price (THB)   # ยอดก่อน VAT (Total Net Price = รวม VAT 7%)

# P-line ที่ไม่นับเป็นยอดขาย (เช่น OBS = Outstanding Balance Old System)
exclude_plines: [OBS]

# จำนวนปีย้อนหลังที่ใช้เช็คลูกค้าใหม่ / สินค้าใหม่ (ไม่นับปีที่คำนวณ)
lookback_years: 2

rates:
  NC: 0.03     # ลูกค้าใหม่
  OCNP: 0.01   # ลูกค้าเก่า + สินค้าใหม่
  OCOP: 0.005  # ลูกค้าเก่า + สินค้าเก่า
